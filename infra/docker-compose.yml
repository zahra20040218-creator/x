# Local stack. CLAUDE.md §3.3: the API NEVER connects to Postgres directly.
# Port 5432 is exposed only so migrations and psql can reach it; DATABASE_URL
# points at PgBouncer on 6432.
name: rideapp

services:

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: rideapp
      POSTGRES_PASSWORD: rideapp
      POSTGRES_DB: rideapp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rideapp -d rideapp"]
      interval: 5s
      timeout: 3s
      retries: 20
    # 4-core VPS target (CLAUDE.md §3). Postgres itself gets a modest cap
    # because PgBouncer, not Postgres, is what absorbs connection churn.
    command:
      - "postgres"
      - "-c"
      - "max_connections=100"
      - "-c"
      - "shared_buffers=512MB"

  pgbouncer:
    image: edoburu/pgbouncer:v1.23.1-p2
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: rideapp
      DB_PASSWORD: rideapp
      DB_NAME: rideapp
      # transaction pooling is what makes 500 concurrent users fit in a small
      # server-side pool. It forbids session-level state (SET, advisory locks
      # held across statements, LISTEN/NOTIFY) - the API must not use them.
      POOL_MODE: transaction
      MAX_CLIENT_CONN: "1000"
      DEFAULT_POOL_SIZE: "25"
      RESERVE_POOL_SIZE: "5"
      AUTH_TYPE: scram-sha-256
    ports:
      - "6432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U rideapp || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    # Driver presence and claims are recoverable state, but losing the geo set
    # mid-shift empties the map for every rider. AOF everysec is the cheap
    # insurance; it is not a durability guarantee for money (money is in PG).
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: "3000"
      DATABASE_URL: postgresql://rideapp:rideapp@pgbouncer:5432/rideapp
      DATABASE_MIGRATION_URL: postgresql://rideapp:rideapp@postgres:5432/rideapp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-not-for-any-real-deployment
    ports:
      - "3000:3000"
    command: ["node", "dist/main.js"]

  worker:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    depends_on:
      pgbouncer:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://rideapp:rideapp@pgbouncer:5432/rideapp
      REDIS_URL: redis://redis:6379
      JWT_SECRET: local-development-secret-not-for-any-real-deployment
    # CLAUDE.md §3.2 - queues are a separate process. If workers share the API
    # process, a slow FCM call steals event-loop time from request handling.
    command: ["node", "dist/worker.js"]

volumes:
  pgdata:
  redisdata:
