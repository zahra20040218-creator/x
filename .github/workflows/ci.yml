name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API — test, lint, typecheck
    runs-on: ubuntu-latest

    # These services are the whole point of this job.
    #
    # The unit suite runs against an in-memory Redis so it works on a laptop
    # without Docker. That is a convenience with a cost: the fake is unverified.
    # `redis-conformance` runs the IDENTICAL assertions against the real thing,
    # and it SKIPS when TEST_REDIS_URL is unset. So if this workflow ever stops
    # setting TEST_REDIS_URL, the suite still goes green and the concurrency
    # guarantees quietly stop being verified anywhere.
    #
    # If you are editing this file: do not remove these services without
    # removing the skip-guard in test/integration/*.test.ts first, so that the
    # loss is loud instead of silent.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: rideapp
          POSTGRES_PASSWORD: rideapp
          POSTGRES_DB: rideapp_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U rideapp -d rideapp_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 20

    env:
      # REAL_INFRA is the switch, and it was never set.
      #
      # `isRealInfraRequested()` (test/support/real-infra.ts) reads exactly
      # `REAL_INFRA === '1'`. Supplying TEST_DATABASE_URL and TEST_REDIS_URL is
      # not opting in - without this line every real-infrastructure test in the
      # repository skipped on every run, while the job went green.
      #
      # What was skipping is not a corner: the atomic-claim proof that
      # CLAUDE.md §5.1 rests on, the capability/subscription gate, the real
      # Postgres migration checks, and the Redis pub/sub reconnect suite. The
      # guard step below was written to catch exactly this and could not,
      # because the string it greps for only appears once the suite runs.
      #
      # Setting this makes the helpers THROW when a service is missing rather
      # than fall back to a fake, which is the intended contract - a red build
      # for absent infrastructure, never a green one for untested code.
      REAL_INFRA: '1'
      TEST_DATABASE_URL: postgresql://rideapp:rideapp@localhost:5432/rideapp_test
      DATABASE_MIGRATION_URL: postgresql://rideapp:rideapp@localhost:5432/rideapp_test
      TEST_REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck (tsc --noEmit, strict)
        run: pnpm --filter @rideapp/api typecheck

      - name: Lint
        run: pnpm --filter @rideapp/api lint

      - name: Migrations run clean UP on a fresh database
        run: pnpm --filter @rideapp/api migrate:up

      # CLAUDE.md §11 Definition of Done: "Migrations run cleanly up and down on
      # a fresh DB." Down-then-up again proves the down migrations are real and
      # not just files that exist.
      - name: Migrations run clean DOWN and back UP
        run: |
          pnpm --filter @rideapp/api migrate:down 4
          pnpm --filter @rideapp/api migrate:up

      - name: Unit tests with coverage gates
        run: pnpm --filter @rideapp/api test

      - name: Integration tests (real Postgres + real Redis)
        run: pnpm --filter @rideapp/api test:integration

      # A green integration run that actually skipped everything is worse than a
      # red one, because it reads as verification. This step fails the build if
      # the conformance suite did not really execute.
      # A green integration run that actually skipped everything is worse than a
      # red one, because it reads as verification.
      #
      # This step used to re-run the whole suite to grep its output, which
      # doubled the slowest job in CI to check a fact the first run already
      # knew. It now asserts on the run above, and asserts the stronger thing:
      # that ZERO tests were skipped, not merely that one named suite appeared.
      # The old grep passed only because it never ran - REAL_INFRA was unset, so
      # the string was absent and the build should have failed. It did not,
      # because the step was added after the skip was already universal and
      # nobody saw a passing baseline.
      - name: Assert no integration test skipped
        run: |
          OUT=$(pnpm --filter @rideapp/api test:integration --reporter=basic 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -qE "[1-9][0-9]* skipped"; then
            echo "FAIL: integration tests were skipped."
            echo "REAL_INFRA is set for this job, so a skip means a helper opted"
            echo "out rather than connecting. A skipped concurrency proof is an"
            echo "unproven concurrency guarantee. Refusing to pass."
            exit 1
          fi
          if ! echo "$OUT" | grep -qE "IoRedisAdapter \(real Redis\)"; then
            echo "FAIL: the real-Redis conformance suite did not run."
            echo "The in-memory Redis is therefore unverified, and every"
            echo "concurrency guarantee in this repo rests on it. Refusing to pass."
            exit 1
          fi
          echo "OK: real-Redis conformance executed and nothing skipped." 

      # The e2e suite was never in this file. 106 tests that drive the API over
      # real HTTP against real Postgres and real Redis - the only place the
      # webhook signature check, the problem+json shape and the full ride
      # lifecycle are exercised end to end - ran on a developer machine and
      # nowhere else. A suite CI does not run is a suite that rots.
      - name: E2E tests (real Postgres + real Redis, over HTTP)
        run: pnpm --filter @rideapp/api test:e2e

      - name: Assert no e2e test skipped
        run: |
          OUT=$(pnpm --filter @rideapp/api test:e2e --reporter=basic 2>&1)
          echo "$OUT"
          if echo "$OUT" | grep -qE "[1-9][0-9]* skipped"; then
            echo "FAIL: e2e tests were skipped."
            echo "REAL_INFRA is set for this job, so a skip means a helper opted"
            echo "out rather than connecting. Refusing to pass."
            exit 1
          fi
          echo "OK: e2e executed and nothing skipped."

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore

  # Present and deliberately failing-open, because no Flutter code exists yet.
  # It is here so that the day apps/rider gains a pubspec.yaml, CI covers it
  # rather than someone remembering to add a job.
  flutter:
    name: Flutter — analyze and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `ls a b c d` is false when ANY of the four is missing, and CLAUDE.md
      # §1.1 says apps/rider and apps/driver are being merged into apps/aly and
      # will be deleted. On the day that happens this job would have gone
      # quiet, announcing "no Flutter packages yet" over 24,000 lines of Dart.
      #
      # Find them instead of naming them, and fail loudly if none is found -
      # a repository with no pubspec is a repository where something went
      # wrong, not one that should be waved through.
      - name: Detect Flutter packages
        id: detect
        run: |
          PACKAGES=$(find packages apps -maxdepth 2 -name pubspec.yaml | xargs -n1 dirname | sort)

          if [ -z "$PACKAGES" ]; then
            echo "FAIL: no pubspec.yaml anywhere under packages/ or apps/."
            echo "This job exists to analyse and test Dart. Finding none means"
            echo "the checkout is wrong or the packages were removed. Passing"
            echo "silently is how a test suite disappears without anyone"
            echo "noticing. Refusing to pass."
            exit 1
          fi

          echo "Found:"
          echo "$PACKAGES"
          {
            echo "packages<<EOF"
            echo "$PACKAGES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      # Whatever the detect step found, not a hardcoded list. apps/rider and
      # apps/driver are still built while they still ship - the merge into
      # apps/aly is additive until the owner cuts over, and a package nobody
      # builds is a package that silently rots.
      - name: Analyze and test
        run: |
          echo "${{ steps.detect.outputs.packages }}" | while read -r dir; do
            [ -n "$dir" ] || continue
            echo "::group::$dir"
            (cd "$dir" && flutter pub get && flutter analyze && flutter test)
            echo "::endgroup::"
          done
