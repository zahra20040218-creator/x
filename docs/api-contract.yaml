openapi: 3.1.0
info:
  title: Ride-hailing API (Baghdad v1)
  version: 1.0.0
  description: |
    Binding API contract. CLAUDE.md §12.1: no endpoint may exist in the code that
    is not in this file. Adding an endpoint means changing this file first, in
    its own commit, with a reason.

    Conventions:
      * All money fields are named `*_iqd`, are integers, and are whole Iraqi
        Dinars (CLAUDE.md §6.1). A fractional value in any `*_iqd` field is a
        contract violation, not a rounding detail.
      * All timestamps are RFC 3339 UTC. Clients render in Asia/Baghdad.
      * All errors are RFC 9457 `application/problem+json` (CLAUDE.md §9).
      * Every request carries `X-Request-Id`; the server generates one if absent
        and always echoes it.
      * Bearer JWT auth unless the operation is explicitly marked `security: []`.

servers:
  - url: /v1

tags:
  - name: auth
  - name: rider
  - name: driver
  - name: shared
  - name: admin
  - name: payments
  - name: ops

security:
  - bearerAuth: []

paths:

  # ===========================================================================
  # OPS
  # ===========================================================================

  /health:
    get:
      tags: [ops]
      operationId: health
      summary: Liveness. Never touches the database.
      security: []
      responses:
        '200':
          description: Process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /health/ready:
    get:
      tags: [ops]
      operationId: readiness
      summary: Readiness. Checks Postgres (via PgBouncer) and Redis.
      security: []
      responses:
        '200':
          description: All dependencies reachable.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReadinessReport' }
        '503':
          description: A dependency is unreachable.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  # ===========================================================================
  # AUTH
  # ===========================================================================

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: verifyOtp
      security: []
      summary: |
        Exchange a Firebase Phone Auth ID token for platform tokens.
        The OTP itself is sent and verified by Firebase on the device; the
        server never sees or generates an OTP code.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [firebaseIdToken, role]
              properties:
                firebaseIdToken: { type: string, minLength: 1, maxLength: 4096 }
                role:
                  type: string
                  enum: [RIDER, DRIVER]
                  description: |
                    ADMIN cannot be obtained here. Admin accounts are created by
                    another admin and sign in through the same endpoint with
                    role RIDER omitted — see /admin/session.
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 120
                  description: Required only on first sign-up for role RIDER.
      responses:
        '200':
          description: Authenticated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: |
            Role DRIVER requested but no driver record exists. In v1 admins
            create drivers manually (CLAUDE.md §2), so a driver cannot self
            sign-up.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [refreshToken]
              properties:
                refreshToken: { type: string, minLength: 1 }
      responses:
        '200':
          description: New token pair. The presented refresh token is rotated and revoked.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthSession' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      responses:
        '204': { description: Refresh tokens for this user revoked. }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /metrics:
    get:
      tags: [ops]
      operationId: getMetrics
      summary: Prometheus metrics.
      description: >
        CONTRACT CHANGE, 2026-08-23. Added with the observability work.

        Requires `Authorization: Bearer $METRICS_TOKEN`. When METRICS_TOKEN is
        unset the endpoint returns 404 and metrics are not exposed at all -
        fail-closed, because ride volume and error rates are operational and
        competitive information.

        Returns 404 rather than 401 on a bad token, so a scan cannot learn that
        metrics exist here.
      responses:
        '200':
          description: Metrics in Prometheus text exposition format.
          content:
            text/plain:
              schema: { type: string }
        '404':
          description: Metrics are disabled, or the token was wrong.

  /devices:
    post:
      tags: [shared]
      operationId: registerDevice
      summary: Register this device for push notifications.
      description: >
        CONTRACT CHANGE, 2026-08-23. Added because push delivery had no way to
        reach a device: the backend enqueued push jobs and the worker logged
        and dropped them, and there was nowhere for a device token to be stored
        in the first place.

        Idempotent by token. Re-registering the same token refreshes its
        last_seen_at rather than creating a duplicate, because the apps
        re-register on every launch and FCM reissues tokens on reinstall.

        A token is bound to the authenticated caller. Registering a token that
        already belongs to another user REASSIGNS it - that is the correct
        behaviour when two people share a handset, and it is what stops ride
        offers following the previous owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token, platform]
              properties:
                token:
                  type: string
                  minLength: 1
                  maxLength: 4096
                  description: The FCM registration token.
                platform:
                  type: string
                  enum: [ANDROID, IOS]
      responses:
        '204':
          description: Registered.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags: [shared]
      operationId: unregisterDevice
      summary: Stop sending push notifications to this device.
      description: >
        Called on sign-out. Without it a driver who logs out keeps receiving
        ride offers on a phone they are no longer working from.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [token]
              properties:
                token: { type: string, minLength: 1, maxLength: 4096 }
      responses:
        '204':
          description: Unregistered, or was not registered.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags: [shared]
      operationId: getMe
      responses:
        '200':
          description: The authenticated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags: [shared]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 120 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===========================================================================
  # RIDER
  # ===========================================================================

  /me/delete:
    post:
      tags: [auth]
      operationId: deleteOwnAccount
      summary: |
        Erase this account, at the user's own request.

        Google Play requires an in-app path to account deletion. This is it.

        **It anonymises; it does not DELETE a row.** Eighteen foreign keys point
        at `users(id)`, all `ON DELETE RESTRICT`, and `ledger_entries` is
        append-only with database triggers (CLAUDE.md §6.3) — a hard delete is
        refused by the schema, and correctly, because a completed ride and its
        ledger rows must not come to reference a person who no longer exists.

        ERASED: phone number, display name, Firebase identity, device tokens,
        refresh tokens, and the driver's location history.

        RETAINED, now unattributable: ledger entries, rides, ride events and
        payments — the money and the audit trail. Disclosed in
        `docs/PLAY_LISTING.md`, which is what makes retaining it permissible.

        Idempotent: deleting an already-deleted account returns 204, because a
        client retrying after a dropped response must not be told it failed.

        POST rather than DELETE on `/me`: the operation is not a resource
        removal and the distinction matters to anyone reading the log.
      responses:
        '204':
          description: Erased. Every session for this account is now invalid.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            A ride is in progress. Erasing a rider mid-trip leaves a driver
            carrying a passenger the system cannot name; erasing a driver
            mid-trip leaves a rider in a car nobody is tracking. `rideId` is in
            the problem body so the app can offer to open it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /fare/estimate:
    post:
      tags: [rider]
      operationId: estimateFare
      summary: |
        Quote a fare. Pure arithmetic over the configured tariff plus a routing
        distance. The routing call is NOT made synchronously here (CLAUDE.md
        §3.2) — the server uses a haversine estimate with a configured road
        factor. Precise routing is a queued job used only for post-trip
        reconciliation.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, dropoff]
              properties:
                pickup:   { $ref: '#/components/schemas/LatLng' }
                dropoff:  { $ref: '#/components/schemas/LatLng' }
      responses:
        '200':
          description: Quote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FareEstimate' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /rides:
    post:
      tags: [rider]
      operationId: createRide
      summary: |
        Request a ride. CLAUDE.md §5.2: `Idempotency-Key` is REQUIRED. Replaying
        the same key with the same body within 24h returns the ORIGINAL ride
        with HTTP 200 and never creates a second ride.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pickup, dropoff]
              properties:
                pickup:          { $ref: '#/components/schemas/LatLng' }
                pickupAddress:   { type: string, maxLength: 400 }
                dropoff:         { $ref: '#/components/schemas/LatLng' }
                dropoffAddress:  { type: string, maxLength: 400 }
                paymentMethod:
                  type: string
                  enum: [CASH]
                  default: CASH
                  description: GATEWAY is defined in the schema but rejected in v1 (CLAUDE.md §7).
                proposedFareIqd:
                  type: integer
                  minimum: 1
                  maximum: 100000000
                  description: |
                    What the rider offers to pay, in whole IQD. Optional, and
                    ignored entirely unless `negotiation_enabled` is on.

                    Supplying it is what opens the ride to driver bids — without
                    it `/rides/{rideId}/bids` has nothing to bid against, which
                    is why bidding was unreachable through the API before this
                    field existed.

                    Bounded server-side to `negotiation_band_bps` around the
                    metered estimate. A rider must not be able to anchor at 500
                    IQD, and a driver must not be able to hold out for ten times
                    the meter.
      responses:
        '201':
          description: New ride created and queued for matching.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '200':
          description: |
            Idempotency-Key replay. This is the ORIGINAL ride, unchanged.
            Distinguishable from 201 by status code alone.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: |
            Either the rider already has a live ride, or the same
            Idempotency-Key was reused with a DIFFERENT body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /rides/me:
    get:
      tags: [shared]
      operationId: listMyRides
      summary: |
        The caller's own rides. A rider sees rides where they are the rider; a
        driver sees rides where they are the assigned driver. There is no
        parameter that widens this — the filter is derived from the token, not
        from input (ACCEPTANCE_CHECKLIST.md check 5).
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RideStatus' }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Page of rides, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RidePage' }
        '401':
          $ref: '#/components/responses/Unauthorized'

  /rides/{rideId}:
    parameters:
      - $ref: '#/components/parameters/RideId'
    get:
      tags: [shared]
      operationId: getRide
      summary: |
        A single ride. Readable only by its rider, its assigned driver, a driver
        holding a live offer on it, or an admin. Everyone else gets 404 — not
        403 — so the endpoint does not confirm that a ride id exists.
      responses:
        '200':
          description: The ride.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /rides/{rideId}/cancel:
    parameters:
      - $ref: '#/components/parameters/RideId'
    post:
      tags: [shared]
      operationId: cancelRide
      summary: |
        Cancel. The resulting state depends on the caller's role:
        rider → CANCELLED_BY_RIDER, driver → CANCELLED_BY_DRIVER,
        admin on an IN_PROGRESS ride → CANCELLED_IN_TRIP.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 400 }
      responses:
        '200':
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'

  /rides/{rideId}/rate:
    parameters:
      - $ref: '#/components/parameters/RideId'
    post:
      tags: [shared]
      operationId: rateRide
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [score]
              properties:
                score:   { type: integer, minimum: 1, maximum: 5 }
                comment: { type: string, maxLength: 1000 }
      responses:
        '201':
          description: Rating stored.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Rating' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Ride is not COMPLETED, or the caller already rated it.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/ValidationError'

  # ===========================================================================
  # DRIVER
  # ===========================================================================

  /driver/availability:
    put:
      tags: [driver]
      operationId: setDriverAvailability
      summary: |
        Go online or offline. Going ONLINE requires a current position so the
        driver can be placed in the Redis geo set immediately (CLAUDE.md §3.1);
        without it the driver would be "online" but unmatchable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [availability]
              properties:
                availability:
                  type: string
                  enum: [ONLINE, OFFLINE]
                position: { $ref: '#/components/schemas/LatLng' }
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverState' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Cannot go OFFLINE while assigned to a live ride.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422':
          $ref: '#/components/responses/ValidationError'

  /driver/location:
    post:
      tags: [driver]
      operationId: reportDriverLocation
      summary: |
        Report one or more position samples. Accepts a BATCH because the driver
        app buffers while offline and flushes on reconnect (CLAUDE.md §5.3).
        Writes to Redis only; Postgres is written by the 30s flush job
        (CLAUDE.md §3.1). Returns 202 — the caller must not wait on durability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [samples]
              properties:
                samples:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items: { $ref: '#/components/schemas/LocationSample' }
      responses:
        '202':
          description: Accepted for processing.
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted: { type: integer, minimum: 0 }
                  rejected: { type: integer, minimum: 0 }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'

  /driver/offers/current:
    get:
      tags: [driver]
      operationId: getCurrentOffer
      summary: |
        The offer outstanding for this driver, if any. Polling fallback for when
        the push/WebSocket path failed — the driver app must not depend solely
        on FCM delivery.
      responses:
        '200':
          description: An offer is outstanding.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideOffer' }
        '204':
          description: No outstanding offer.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'

  /rides/{rideId}/accept:
    parameters:
      - $ref: '#/components/parameters/RideId'
    post:
      tags: [driver]
      operationId: acceptRide
      summary: |
        Accept an offer. CLAUDE.md §5.1: the winner is decided by
        `SET ride:{rideId}:claim {driverId} NX PX 30000`. Exactly one caller can
        get 200; every other concurrent caller gets 409 with
        `type: .../ride-already-claimed`.
      responses:
        '200':
          description: This driver won the claim and is now assigned.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another driver already claimed it, or the offer expired.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

  /rides/{rideId}/decline:
    parameters:
      - $ref: '#/components/parameters/RideId'
    post:
      tags: [driver]
      operationId: declineRide
      responses:
        '204':
          description: Declined; the ride is re-offered to the next candidate.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/InvalidTransition'

  /rides/{rideId}/arrived:
    parameters:
      - $ref: '#/components/parameters/RideId'
    post:
      tags: [driver]
      operationId: markDriverArrived
      responses:
        '200':
          description: ACCEPTED → DRIVER_ARRIVED.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /rides/{rideId}/start:
    parameters:
      - $ref: '#/components/parameters/RideId'
    post:
      tags: [driver]
      operationId: startRide
      responses:
        '200':
          description: DRIVER_ARRIVED → IN_PROGRESS.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ride' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }

  /rides/{rideId}/complete:
    parameters:
      - $ref: '#/components/parameters/RideId'
    post:
      tags: [driver]
      operationId: completeRide
      summary: |
        Finish the trip. Settles the fare, writes the `payments` row and the
        balanced ledger entries in ONE database transaction with the status
        change. Idempotent by ride: completing an already-COMPLETED ride returns
        200 with the same body and writes nothing.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                actualDistanceM:
                  type: integer
                  minimum: 0
                  maximum: 1000000
                  description: Odometer distance from the driver app. Omitted → the estimate is used.
      responses:
        '200':
          description: Completed and settled.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RideSettlement' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/InvalidTransition' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ---------------------------------------------------------------------------
  # Fare negotiation
  #
  # Owner decision 2026-08-25, recorded in CLAUDE.md §2 SCOPE EXPANSION.
  #
  # This does NOT replace nearest-driver dispatch. §5.1's atomic claim still
  # decides who gets a ride, and direct dispatch stays as the fallback when
  # nobody bids. Negotiation adds a window, before dispatch, in which drivers
  # commit to a price.
  #
  # The load-bearing idea: a driver's bid IS their acceptance. It is a binding
  # commitment at that fare. When the rider selects one, the server takes the
  # Redis claim on that driver's behalf and runs
  # REQUESTED -> OFFERED -> ACCEPTED through RideStateMachine unchanged. No new
  # transition rule, no bypass of the claim, and every existing guarantee about
  # one-winner still holds by construction rather than by a second mechanism.
  #
  # Disabled by default: platform_config.negotiation_enabled is seeded 'false'.
  # With it false these endpoints return 404 and ride creation behaves exactly
  # as it does today.
  # ---------------------------------------------------------------------------

  /driver/ride-requests:
    get:
      tags: [driver]
      operationId: listOpenRideRequests
      summary: |
        Open ride requests this driver may bid on.

        Scoped by the driver's current Redis position and the configured search
        radius, so a driver never sees a request they could not serve. Requires
        the full capability check (CLAUDE.md §1.1) - a suspended, unapproved or
        unsubscribed driver gets 403, not an empty list, so the app can say why.
      responses:
        '200':
          description: Requests within range, nearest first.
          content:
            application/json:
              schema:
                type: object
                required: [requests]
                properties:
                  requests:
                    type: array
                    items:
                      $ref: '#/components/schemas/OpenRideRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: This account may not currently drive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Negotiation is disabled.

  /rides/{rideId}/bids:
    parameters:
      - $ref: '#/components/parameters/RideId'
    get:
      tags: [rider]
      operationId: listRideBids
      summary: |
        The bids on the caller's own ride, cheapest first.

        Rider-only, and only their own ride - a driver reading this would learn
        what their competitors offered.
      responses:
        '200':
          description: Active bids.
          content:
            application/json:
              schema:
                type: object
                required: [bids, proposedFareIqd]
                properties:
                  proposedFareIqd:
                    type: integer
                    description: What the rider asked for, for comparison.
                  bids:
                    type: array
                    items:
                      $ref: '#/components/schemas/RideBid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [driver]
      operationId: placeRideBid
      summary: |
        Bid on a ride, or replace this driver's existing bid.

        A driver has at most ONE active bid per ride, enforced by a partial
        unique index. Bidding again supersedes the previous bid rather than
        editing it: the history is what a fare dispute is argued from, and an
        UPDATE destroys it.

        Accepting the rider's own price is a bid at exactly that amount, not a
        separate endpoint - one path to commit means one path to get wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountIqd]
              properties:
                amountIqd:
                  type: integer
                  description: |
                    Whole Iraqi dinars (CLAUDE.md §6.1). Must be a multiple of
                    fare_rounding_iqd and within the configured band around the
                    rider's proposal, so a driver cannot bid 1 IQD to win the
                    list and renegotiate in the car.
                  example: 7500
                etaSeconds:
                  type: integer
                  description: Driver's own estimate of time to pickup.
      responses:
        '201':
          description: Bid placed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RideBid'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: This account may not currently drive.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The ride is no longer open for bids.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: The amount is outside the permitted band.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /rides/{rideId}/bids/{bidId}/accept:
    parameters:
      - $ref: '#/components/parameters/RideId'
      - name: bidId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      tags: [rider]
      operationId: acceptRideBid
      summary: |
        The rider selects a bid. The ride is assigned at that fare.

        Runs the driver's claim (§5.1) and then REQUESTED -> OFFERED -> ACCEPTED
        through RideStateMachine. 409 if that driver has since taken another
        ride, or if another of this rider's requests already resolved - the
        existing rides_one_active_per_driver_uq index is the backstop.
      responses:
        '200':
          description: Assigned. agreedFareIqd is now set on the ride.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Ride'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: The bid or the driver is no longer available.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'

  /me/capabilities:
    get:
      tags: [auth]
      operationId: getCapabilities
      summary: |
        What this account may do, decided by the server (CLAUDE.md §1.1).

        ALY is one app with a Rider mode and a Driver mode, so the client must
        not decide which it may enter. This returns the authoritative answer and
        is the SAME evaluation the server enforces with - if this and the guard
        could disagree, the app would offer a mode the server is about to
        refuse.

        Returns the FULL blocker list, not the first failure: a driver who is
        unapproved and also missing a licence needs to see both, or they fix one
        and learn the second only by failing again.
      responses:
        '200':
          description: The caller's capabilities.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Capabilities'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /driver/wallet:
    get:
      tags: [driver]
      operationId: getMyWallet
      summary: Balance derived from the ledger (CLAUDE.md §6.4), never a stored counter.
      responses:
        '200':
          description: Wallet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /driver/wallet/entries:
    get:
      tags: [driver]
      operationId: listMyWalletEntries
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Page of the caller's own ledger entries, newest first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LedgerEntryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /driver/subscription/plans:
    get:
      tags: [driver]
      operationId: listSubscriptionPlans
      summary: |
        The plans a driver may buy. Active plans only, cheapest first.

        Readable whether or not `subscription_required` is on: a driver should
        be able to see what a subscription costs before it gates anything, and
        the same list is what the admin grant path charges against.
      responses:
        '200':
          description: Active plans.
          content:
            application/json:
              schema:
                type: object
                required: [plans]
                properties:
                  plans:
                    type: array
                    items: { $ref: '#/components/schemas/SubscriptionPlan' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /driver/subscription:
    get:
      tags: [driver]
      operationId: getMySubscription
      summary: |
        The caller's live subscription, or null.

        `expiresAt` is the authoritative date and is compared against the server
        clock, not against the stored status - a status column is only as fresh
        as the last sweep, and between two sweeps it would say ACTIVE for a
        lapsed subscription.
      responses:
        '200':
          description: The caller's subscription, or null when they have none.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverSubscriptionOrNull' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/drivers/{driverId}/subscription:
    parameters:
      - name: driverId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      operationId: adminGrantSubscription
      summary: |
        Sell a driver a subscription period, collected in cash by the operator.

        This is the ONLY way a subscription is created in v1, and it is
        deliberately an admin action rather than a self-service purchase: there
        is no live payment rail (CLAUDE.md §2 keeps one OUT of scope, and
        DECISIONS.md D-019 records why it stays out until there are drivers
        paying). The operator takes the cash and records it here.

        Writes, in ONE transaction: any current ACTIVE row is expired, the new
        row is inserted, and — unless `chargeIqd` is 0 — a balanced ledger pair
        is written DEBIT `DRIVER_WALLET` / CREDIT `PLATFORM_REVENUE`
        (CLAUDE.md §6.2). The ledger transaction id is stored on the
        subscription so a billing dispute can be traced to the money.

        `Idempotency-Key` is REQUIRED. A retried grant must not charge twice,
        and the ledger is append-only (CLAUDE.md §6.3) so a duplicate charge
        could never be deleted, only offset.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [planCode]
              properties:
                planCode:
                  type: string
                  maxLength: 64
                  description: Code of an ACTIVE plan.
                chargeIqd:
                  type: integer
                  minimum: 0
                  maximum: 100000000
                  description: |
                    Whole IQD actually collected. Defaults to the plan price.
                    Pass 0 to grant a free period — no ledger rows are written,
                    because the schema forbids a zero-amount entry and a
                    transaction of one row could not balance.
                note:
                  type: string
                  maxLength: 200
      responses:
        '201':
          description: Granted.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverSubscription' }
        '200':
          description: Idempotency-Key replay; the original grant, not a second one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DriverSubscription' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404':
          description: Driver or plan not found.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '409':
          description: Same Idempotency-Key reused with a different body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===========================================================================
  # ADMIN
  # ===========================================================================

  /admin/drivers:
    get:
      tags: [admin]
      operationId: adminListDrivers
      parameters:
        - name: availability
          in: query
          schema: { type: string, enum: [OFFLINE, ONLINE, ON_TRIP] }
        - name: suspended
          in: query
          schema: { type: boolean }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Page of drivers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDriverPage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [admin]
      operationId: adminCreateDriver
      summary: v1 has no driver self-signup and no KYC upload (CLAUDE.md §2).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [phone, displayName, vehiclePlate, vehicleModel, vehicleColor]
              properties:
                phone:
                  type: string
                  description: Accepts 07XXXXXXXXX or +9647XXXXXXXXX; normalised to E.164 server-side (CLAUDE.md §8).
                displayName:  { type: string, minLength: 1, maxLength: 120 }
                vehiclePlate: { type: string, minLength: 1, maxLength: 40 }
                vehicleModel: { type: string, minLength: 1, maxLength: 80 }
                vehicleColor: { type: string, minLength: 1, maxLength: 40 }
      responses:
        '201':
          description: Driver created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDriver' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: A driver already exists for that phone number.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/drivers/{driverId}:
    parameters:
      - name: driverId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      operationId: adminGetDriver
      responses:
        '200':
          description: Driver.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDriver' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [admin]
      operationId: adminUpdateDriver
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName:     { type: string, minLength: 1, maxLength: 120 }
                vehiclePlate:    { type: string, minLength: 1, maxLength: 40 }
                vehicleModel:    { type: string, minLength: 1, maxLength: 80 }
                vehicleColor:    { type: string, minLength: 1, maxLength: 40 }
                isSuspended:     { type: boolean }
                suspendedReason: { type: string, maxLength: 400 }
      responses:
        '200':
          description: Updated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDriver' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/drivers/{driverId}/documents:
    parameters:
      - name: driverId
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      tags: [admin]
      operationId: adminListDriverDocuments
      summary: Documents on file for a driver, with a live compliance verdict.
      description: >
        The verdict is computed at request time, not stored, so it reflects
        today's expiry dates and today's configured policy. Added 2026-08-24 by
        owner decision overriding the CLAUDE.md 2 KYC scope entry; see
        DECISIONS.md. v1 records that an administrator SAW a document - there is
        no image upload.
      responses:
        '200':
          description: Documents and verdict.
          content:
            application/json:
              schema:
                type: object
                required: [items, compliance]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DriverDocument' }
                  compliance: { $ref: '#/components/schemas/ComplianceVerdict' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/drivers/{driverId}/documents/{docType}:
    parameters:
      - name: driverId
        in: path
        required: true
        schema: { type: string, format: uuid }
      - name: docType
        in: path
        required: true
        schema: { $ref: '#/components/schemas/DriverDocumentType' }
    put:
      tags: [admin]
      operationId: adminRecordDriverDocument
      summary: Record the outcome of checking a document.
      description: >
        PUT, and one row per (driver, document type): re-checking a renewed
        licence updates the record rather than adding a second one. The history
        is in the audit log, which is already append-only.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:    { type: string, enum: [PENDING, VERIFIED, REJECTED] }
                reference:
                  type: string
                  maxLength: 120
                  description: The number printed on the document. Not the document.
                expiresAt:
                  type: string
                  format: date
                  description: >
                    YYYY-MM-DD. A date, not a timestamp - documents expire on a
                    day, and the document is valid through the whole of it.
                note:      { type: string, maxLength: 500 }
      responses:
        '200':
          description: The driver's documents after the change.
          content:
            application/json:
              schema:
                type: object
                required: [items, compliance]
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/DriverDocument' }
                  compliance: { $ref: '#/components/schemas/ComplianceVerdict' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationFailed' }

  /admin/drivers/{driverId}/wallet/topup:
    parameters:
      - name: driverId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      operationId: adminTopUpWallet
      summary: |
        Credit a driver wallet. Writes a balanced pair of ledger entries
        (MANUAL_ADJUSTMENT debit / DRIVER_WALLET credit). `Idempotency-Key` is
        REQUIRED: a retried top-up must not double-credit.
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountIqd]
              properties:
                amountIqd:
                  type: integer
                  minimum: 1
                  maximum: 100000000
                  description: Whole IQD. A non-integer is rejected with 422.
                reference: { type: string, maxLength: 200 }
      responses:
        '201':
          description: Credited.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '200':
          description: Idempotency-Key replay; the original top-up, not a second one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Wallet' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Same Idempotency-Key reused with a different body.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/rides:
    get:
      tags: [admin]
      operationId: adminListRides
      description: Served by `rides_status_created_at_idx` (CLAUDE.md §3.4).
      parameters:
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/RideStatus' }
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Page of rides.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RidePage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/rides/{rideId}:
    parameters:
      - $ref: '#/components/parameters/RideId'
    get:
      tags: [admin]
      operationId: adminGetRide
      summary: Ride with its full event timeline and ledger entries.
      responses:
        '200':
          description: Ride detail.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminRideDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/disputes:
    get:
      tags: [admin]
      operationId: adminListDisputes
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, RESOLVED, REJECTED] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Page of disputes.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DisputePage' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [shared]
      operationId: openDispute
      summary: A rider or driver opens a dispute on a ride they were part of.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rideId, reasonCode]
              properties:
                rideId:      { type: string, format: uuid }
                reasonCode:
                  type: string
                  enum: [FARE_WRONG, DRIVER_NO_SHOW, RIDER_NO_SHOW, UNSAFE, OTHER]
                description: { type: string, maxLength: 2000 }
      responses:
        '201':
          description: Dispute opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/disputes/{disputeId}/resolve:
    parameters:
      - name: disputeId
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [admin]
      operationId: adminResolveDispute
      summary: |
        Resolve a dispute, optionally with a monetary correction. A correction
        is always a NEW balanced pair of offsetting ledger entries; no existing
        ledger row is ever modified (CLAUDE.md §6.3).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome, resolution]
              properties:
                outcome:    { type: string, enum: [RESOLVED, REJECTED] }
                resolution: { type: string, minLength: 1, maxLength: 2000 }
                adjustmentIqd:
                  type: integer
                  minimum: -100000000
                  maximum: 100000000
                  description: |
                    Whole IQD applied to the driver wallet. Positive credits the
                    driver, negative debits. Omit for no financial correction.
      responses:
        '200':
          description: Resolved.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dispute' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Dispute is already resolved.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/config:
    get:
      tags: [admin]
      operationId: adminGetConfig
      responses:
        '200':
          description: All platform config keys.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }
    put:
      tags: [admin]
      operationId: adminUpdateConfig
      summary: |
        Change fare or commission settings without a deploy (CLAUDE.md §6.5).
        Only the keys present in the body are changed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                commission_bps:        { type: integer, minimum: 0, maximum: 10000 }
                fare_base_iqd:         { type: integer, minimum: 0, maximum: 1000000 }
                fare_per_km_iqd:       { type: integer, minimum: 0, maximum: 1000000 }
                fare_per_minute_iqd:   { type: integer, minimum: 0, maximum: 1000000 }
                fare_minimum_iqd:      { type: integer, minimum: 0, maximum: 1000000 }
                fare_rounding_iqd:     { type: integer, minimum: 1, maximum: 100000 }
                offer_timeout_seconds: { type: integer, minimum: 5, maximum: 120 }
                search_radius_meters:  { type: integer, minimum: 500, maximum: 50000 }
      responses:
        '200':
          description: Updated config.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlatformConfig' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  # ===========================================================================
  # PAYMENTS
  # ===========================================================================

  /payments/webhook/{provider}:
    parameters:
      - name: provider
        in: path
        required: true
        schema: { type: string, enum: [gateway] }
    post:
      tags: [payments]
      operationId: paymentWebhook
      security: []
      summary: |
        Gateway callback. CLAUDE.md §7: in v1 the gateway is a stub, but the
        handler exists and is a thin wrapper over the pure function
        `(payload, signature) => LedgerCommand[]`, which is unit-tested now.
        Authentication is by HMAC signature header, not a bearer token.
      parameters:
        - name: X-Signature
          in: header
          required: true
          schema: { type: string, maxLength: 512 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '204':
          description: |
            Accepted. NOTE: duplicate suppression is NOT yet implemented — the
            `payment_webhook_events` table and its unique `(provider, external_id)`
            index exist but no code reads or writes them. A duplicate delivery is
            therefore indistinguishable from a first one. This MUST be closed in
            the same change that makes a gateway ledger write reachable, never
            after it (see DECISIONS.md D-019).
        '400':
          description: Malformed payload.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '401':
          description: Bad signature.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }
        '501':
          description: |
            The gateway provider is not implemented in v1 (`NotImplementedError`).
            The signature is still verified before this is returned, so the
            endpoint cannot be used as an unauthenticated oracle.
          content:
            application/problem+json:
              schema: { $ref: '#/components/schemas/Problem' }

# =============================================================================
# REALTIME (not an HTTP path; documented here so the contract is complete)
# =============================================================================
x-realtime:
  url: /v1/realtime
  transport: WebSocket
  auth: |
    First frame after connect must be {"type":"auth","token":"<access JWT>"}.
    The server closes with 4401 if the frame is absent within 5 seconds or the
    token is invalid.
  subscriptions: |
    A client is subscribed ONLY to channels derived from its own token:
      rider:{userId}          - offers/assignment/status for their own rides
      driver:{userId}         - offers and status for their own rides
    There is no client-supplied channel name. A client cannot subscribe to
    another user's channel because it never names a channel at all.
  serverEvents:
    - type: ride.status_changed
      payload: { rideId, status, at }
    - type: ride.offer
      payload: { offerId, rideId, pickup, dropoff, estimatedFareIqd, expiresAt, distanceM }
    - type: ride.offer_revoked
      payload: { offerId, rideId, reason }
    - type: driver.location
      payload: { rideId, lat, lng, headingDeg, at }
      note: |
        Sent to the RIDER of an ACCEPTED/DRIVER_ARRIVED/IN_PROGRESS ride only.
        Never broadcast to other drivers (ACCEPTANCE_CHECKLIST.md check 5).

components:

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    RideId:
      name: rideId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Client-generated UUID v4. CLAUDE.md §5.2.
      schema: { type: string, format: uuid }

  responses:
    Unauthorized:
      description: Missing or invalid token.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Forbidden:
      description: Authenticated but not permitted.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    NotFound:
      description: Not found, or not visible to this caller.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    InvalidTransition:
      description: The requested ride state transition is not permitted from the current state.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
          example:
            type: https://api.rideapp.iq/problems/invalid-ride-transition
            title: Invalid ride transition
            status: 409
            detail: Cannot move ride from COMPLETED to IN_PROGRESS.
            fromState: COMPLETED
            toState: IN_PROGRESS
    ValidationError:
      description: Request failed schema validation.
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    DriverDocumentType:
      type: string
      enum: [NATIONAL_ID, DRIVING_LICENCE, VEHICLE_REGISTRATION, VEHICLE_AUTHORIZATION]

    DriverDocument:
      type: object
      required: [docType, status, reference, expiresAt, verifiedBy, verifiedAt, note, updatedAt]
      properties:
        docType:    { $ref: '#/components/schemas/DriverDocumentType' }
        status:     { type: string, enum: [PENDING, VERIFIED, REJECTED] }
        reference:  { type: string }
        expiresAt:  { type: string, format: date, nullable: true }
        verifiedBy: { type: string, format: uuid, nullable: true }
        verifiedAt: { type: string, format: date-time, nullable: true }
        note:       { type: string }
        updatedAt:  { type: string, format: date-time }

    ComplianceVerdict:
      type: object
      description: >
        Why a driver may not work. EXPIRED is not a stored status - it is
        derived from expiresAt when asked, so it cannot go stale between runs
        of a job. All three lists are empty when no policy is configured, which
        is the default.
      required: [compliant, missing, expired, rejected]
      properties:
        compliant: { type: boolean }
        missing:
          type: array
          description: Required but never supplied, or supplied and still PENDING.
          items: { $ref: '#/components/schemas/DriverDocumentType' }
        expired:
          type: array
          description: Verified, but past its expiry date. Needs renewal, not resubmission.
          items: { $ref: '#/components/schemas/DriverDocumentType' }
        rejected:
          type: array
          items: { $ref: '#/components/schemas/DriverDocumentType' }


    RideBidStatus:
      type: string
      description: |
        A bid's life. SUPERSEDED, not "edited": bidding again writes a new row
        and marks the old one superseded, because the bid history is what a fare
        dispute is argued from and an UPDATE destroys it.
      enum: [ACTIVE, SUPERSEDED, WITHDRAWN, ACCEPTED, REJECTED, EXPIRED]

    RideBid:
      type: object
      required: [id, rideId, driverId, amountIqd, status, createdAt, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        rideId:
          type: string
          format: uuid
        driverId:
          type: string
          format: uuid
        driver:
          allOf:
            - $ref: '#/components/schemas/PublicUser'
          description: |
            Present when a RIDER reads their own bids, so the list can be shown
            without a second round trip. Absent when a driver reads back their
            own bid - a driver has no business receiving another user's profile.
        amountIqd:
          type: integer
          description: Whole Iraqi dinars (CLAUDE.md §6.1). Never a decimal.
          example: 7500
        deltaIqd:
          type: integer
          description: |
            amountIqd minus the rider's proposal. Negative is cheaper than asked.
            Computed server-side because it is the number the rider actually
            compares against, and two clients computing it separately is two
            chances to get the sign wrong.
          example: -500
        status:
          $ref: '#/components/schemas/RideBidStatus'
        etaSeconds:
          type: integer
          nullable: true
          description: The driver's own estimate of time to pickup.
        distanceM:
          type: integer
          description: Driver's distance to the pickup point when the bid was placed.
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
          description: |
            After this the bid cannot be accepted. A price quoted twenty minutes
            ago is not a price.

    OpenRideRequest:
      type: object
      description: |
        A ride a driver may bid on. Deliberately carries NO rider identity - a
        driver decides on the trip and the price, not on who is asking, and
        showing the rider before assignment invites exactly the discrimination
        a marketplace should not have.
      required:
        [rideId, pickup, dropoff, proposedFareIqd, distanceToPickupM, estimatedDistanceM, expiresAt]
      properties:
        rideId:
          type: string
          format: uuid
        pickup:
          $ref: '#/components/schemas/LatLng'
        pickupAddress:
          type: string
          nullable: true
        dropoff:
          $ref: '#/components/schemas/LatLng'
        dropoffAddress:
          type: string
          nullable: true
        proposedFareIqd:
          type: integer
          description: What the rider offered.
        suggestedFareIqd:
          type: integer
          description: |
            The tariff's own estimate for this trip. Shown beside the rider's
            proposal so a driver can see at a glance whether it is fair, rather
            than having to know the tariff by heart.
        distanceToPickupM:
          type: integer
        estimatedDistanceM:
          type: integer
        estimatedDurationS:
          type: integer
        myBid:
          allOf:
            - $ref: '#/components/schemas/RideBid'
          nullable: true
          description: This driver's own active bid, if they have already placed one.
        expiresAt:
          type: string
          format: date-time

    CapabilityBlocker:
      type: string
      description: |
        Why a mode is unavailable, machine-readable. The app localises these
        (CLAUDE.md §8); the server never returns a translated sentence.

        A client MUST tolerate an unknown value here rather than crashing - the
        server may add a blocker before the app is updated, and the safe
        degradation is a generic "contact support" row.
      enum:
        - ACCOUNT_DISABLED
        - NOT_A_DRIVER
        - APPROVAL_PENDING
        - APPROVAL_REJECTED
        - SUSPENDED
        - DOCUMENTS_INCOMPLETE
        - SUBSCRIPTION_REQUIRED

    DriverCapability:
      type: object
      required: [allowed, blockers, missingDocuments, expiredDocuments, rejectedDocuments]
      properties:
        allowed:
          type: boolean
          description: True only when blockers is empty. Never set independently.
        blockers:
          type: array
          items:
            $ref: '#/components/schemas/CapabilityBlocker'
        suspendedReason:
          type: string
          nullable: true
          description: |
            The only free text here, and the one deliberate exception to "no
            prose from the server": it is what an administrator actually typed,
            and a driver is entitled to read the reason they were given rather
            than a generic refusal.
        missingDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DriverDocumentType'
        expiredDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DriverDocumentType'
        rejectedDocuments:
          type: array
          items:
            $ref: '#/components/schemas/DriverDocumentType'
        subscriptionExpiresAt:
          type: string
          format: date-time
          nullable: true
          description: |
            Returned whether or not a subscription is currently required, so a
            driver can see what they bought before the policy is switched on.

    Capabilities:
      type: object
      required: [userId, canRide, driver]
      properties:
        userId:
          type: string
          format: uuid
        canRide:
          type: boolean
          description: |
            True for any account that is not disabled. There is no "rider
            approval" - refusing a banned account is the whole of the rider
            rule, and inventing more would be inventing policy.
        driver:
          $ref: '#/components/schemas/DriverCapability'

    Problem:
      type: object
      description: RFC 9457 problem details.
      required: [type, title, status]
      properties:
        type:     { type: string, format: uri }
        title:    { type: string }
        status:   { type: integer }
        detail:   { type: string }
        instance: { type: string }
        requestId: { type: string }
        errors:
          type: array
          description: Field-level validation failures.
          items:
            type: object
            required: [path, message]
            properties:
              path:    { type: string }
              message: { type: string }
      additionalProperties: true

    LatLng:
      type: object
      required: [lat, lng]
      properties:
        lat: { type: number, minimum: -90,  maximum: 90 }
        lng: { type: number, minimum: -180, maximum: 180 }

    LocationSample:
      type: object
      required: [lat, lng, recordedAt]
      properties:
        lat:         { type: number, minimum: -90,  maximum: 90 }
        lng:         { type: number, minimum: -180, maximum: 180 }
        accuracyM:   { type: number, minimum: 0, maximum: 100000 }
        headingDeg:  { type: number, minimum: 0, maximum: 360 }
        speedMps:    { type: number, minimum: 0, maximum: 200 }
        recordedAt:  { type: string, format: date-time }

    RideStatus:
      type: string
      enum:
        - REQUESTED
        - OFFERED
        - ACCEPTED
        - DRIVER_ARRIVED
        - IN_PROGRESS
        - COMPLETED
        - CANCELLED_BY_RIDER
        - CANCELLED_BY_DRIVER
        - CANCELLED_IN_TRIP
        - EXPIRED
        - NO_DRIVERS_FOUND

    AuthSession:
      type: object
      required: [accessToken, refreshToken, expiresIn, user]
      properties:
        accessToken:  { type: string }
        refreshToken: { type: string }
        expiresIn:    { type: integer, description: Access token lifetime in seconds. }
        user:         { $ref: '#/components/schemas/Me' }

    Me:
      type: object
      required: [id, role, displayName, phone]
      properties:
        id:          { type: string, format: uuid }
        role:        { type: string, enum: [RIDER, DRIVER, ADMIN] }
        displayName: { type: string }
        phone:
          type: string
          description: |
            The caller's OWN phone, in E.164. Never present on any other user's
            representation — see PublicUser.
        rating:      { type: number, nullable: true, minimum: 1, maximum: 5 }
        driver:      { $ref: '#/components/schemas/DriverState' }

    PublicUser:
      type: object
      description: |
        How a counterparty is shown to the other side of a ride. Deliberately
        has NO phone field. ACCEPTANCE_CHECKLIST.md check 5 requires that a
        driver cannot see the rider's number after the trip; the way this is
        guaranteed is that the field does not exist in the response shape at all.
      required: [id, displayName]
      properties:
        id:          { type: string, format: uuid }
        displayName: { type: string }
        rating:      { type: number, nullable: true, minimum: 1, maximum: 5 }
        vehicle:
          type: object
          nullable: true
          properties:
            plate: { type: string }
            model: { type: string }
            color: { type: string }

    DriverState:
      type: object
      required: [availability, isSuspended]
      properties:
        availability: { type: string, enum: [OFFLINE, ONLINE, ON_TRIP] }
        isSuspended:  { type: boolean }
        vehicle:
          type: object
          properties:
            plate: { type: string }
            model: { type: string }
            color: { type: string }

    FareEstimate:
      type: object
      required: [estimatedFareIqd, distanceM, durationS, breakdown]
      properties:
        estimatedFareIqd: { type: integer, minimum: 0, description: Whole IQD. }
        distanceM:        { type: integer, minimum: 0 }
        durationS:        { type: integer, minimum: 0 }
        breakdown:
          type: object
          required: [baseIqd, distanceIqd, timeIqd, minimumAppliedIqd, roundingIqd]
          properties:
            baseIqd:           { type: integer, minimum: 0 }
            distanceIqd:       { type: integer, minimum: 0 }
            timeIqd:           { type: integer, minimum: 0 }
            minimumAppliedIqd: { type: integer, minimum: 0 }
            roundingIqd:       { type: integer, minimum: 0 }

    Ride:
      type: object
      required: [id, status, pickup, dropoff, estimatedFareIqd, paymentMethod, requestedAt]
      properties:
        id:     { type: string, format: uuid }
        status: { $ref: '#/components/schemas/RideStatus' }
        rider:  { $ref: '#/components/schemas/PublicUser' }
        driver:
          oneOf:
            - $ref: '#/components/schemas/PublicUser'
            - type: 'null'
        pickup:          { $ref: '#/components/schemas/LatLng' }
        pickupAddress:   { type: string, nullable: true }
        dropoff:         { $ref: '#/components/schemas/LatLng' }
        dropoffAddress:  { type: string, nullable: true }
        estimatedFareIqd:   { type: integer, minimum: 0 }
        finalFareIqd:       { type: integer, nullable: true, minimum: 0 }
        commissionIqd:      { type: integer, nullable: true, minimum: 0 }
        estimatedDistanceM: { type: integer, minimum: 0 }
        estimatedDurationS: { type: integer, minimum: 0 }
        actualDistanceM:    { type: integer, nullable: true, minimum: 0 }
        paymentMethod:      { type: string, enum: [CASH, GATEWAY] }
        requestedAt:        { type: string, format: date-time }
        acceptedAt:         { type: string, format: date-time, nullable: true }
        driverArrivedAt:    { type: string, format: date-time, nullable: true }
        startedAt:          { type: string, format: date-time, nullable: true }
        completedAt:        { type: string, format: date-time, nullable: true }
        cancelledAt:        { type: string, format: date-time, nullable: true }
        cancellationReason: { type: string, nullable: true }

    RidePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Ride' }
        nextCursor: { type: string, nullable: true }

    RideOffer:
      type: object
      required: [offerId, rideId, pickup, dropoff, estimatedFareIqd, expiresAt, distanceM]
      properties:
        offerId:  { type: string, format: uuid }
        rideId:   { type: string, format: uuid }
        pickup:   { $ref: '#/components/schemas/LatLng' }
        pickupAddress:  { type: string, nullable: true }
        dropoff:  { $ref: '#/components/schemas/LatLng' }
        dropoffAddress: { type: string, nullable: true }
        estimatedFareIqd: { type: integer, minimum: 0 }
        distanceM: { type: integer, minimum: 0, description: Driver-to-pickup distance. }
        expiresAt: { type: string, format: date-time }

    RideSettlement:
      type: object
      required: [ride, payment, ledgerTransactionId]
      properties:
        ride:    { $ref: '#/components/schemas/Ride' }
        payment: { $ref: '#/components/schemas/Payment' }
        ledgerTransactionId: { type: string, format: uuid }

    Payment:
      type: object
      required: [id, provider, status, amountIqd]
      properties:
        id:        { type: string, format: uuid }
        provider:  { type: string, enum: [CASH, GATEWAY] }
        status:    { type: string, enum: [PENDING, CONFIRMED, FAILED, REFUNDED] }
        amountIqd: { type: integer, minimum: 0 }
        confirmedAt: { type: string, format: date-time, nullable: true }

    Wallet:
      type: object
      required: [driverId, balanceIqd]
      properties:
        driverId:   { type: string, format: uuid }
        balanceIqd:
          type: integer
          description: |
            Whole IQD. Derived as SUM(credits) - SUM(debits) over the ledger
            (CLAUDE.md §6.4). May be negative when a driver owes commission.

    SubscriptionPlan:
      type: object
      required: [code, nameAr, nameEn, priceIqd, durationDays]
      properties:
        code:         { type: string, maxLength: 64 }
        nameAr:       { type: string }
        nameEn:       { type: string }
        priceIqd:
          type: integer
          minimum: 0
          description: Whole IQD (CLAUDE.md §6.1). Never a decimal type.
        durationDays: { type: integer, minimum: 1 }

    DriverSubscription:
      type: object
      required: [id, planCode, status, chargedIqd, startedAt, expiresAt]
      properties:
        id:         { type: string, format: uuid }
        planCode:   { type: string }
        status:     { type: string, enum: [ACTIVE, EXPIRED, CANCELLED] }
        chargedIqd:
          type: integer
          minimum: 0
          description: |
            What this driver actually paid, copied at purchase. A plan's price
            may change later; what was charged may not change with it.
        startedAt:  { type: string, format: date-time }
        expiresAt:  { type: string, format: date-time }
        transactionId:
          type: string
          format: uuid
          nullable: true
          description: |
            The ledger transaction that paid for it. Null only for a period an
            administrator granted without charge.

    DriverSubscriptionOrNull:
      nullable: true
      allOf:
        - $ref: '#/components/schemas/DriverSubscription'

    LedgerEntry:
      type: object
      required: [id, transactionId, accountType, direction, amountIqd, createdAt]
      properties:
        id:            { type: string, format: uuid }
        transactionId: { type: string, format: uuid }
        rideId:        { type: string, format: uuid, nullable: true }
        accountType:   { type: string, enum: [DRIVER_WALLET, PLATFORM_REVENUE, DRIVER_CASH_HELD, MANUAL_ADJUSTMENT] }
        direction:     { type: string, enum: [DEBIT, CREDIT] }
        amountIqd:     { type: integer, minimum: 1 }
        description:   { type: string }
        createdAt:     { type: string, format: date-time }

    LedgerEntryPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
        nextCursor: { type: string, nullable: true }

    Rating:
      type: object
      required: [id, rideId, score, createdAt]
      properties:
        id:        { type: string, format: uuid }
        rideId:    { type: string, format: uuid }
        score:     { type: integer, minimum: 1, maximum: 5 }
        comment:   { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    RideEvent:
      type: object
      required: [id, toState, actorType, createdAt]
      properties:
        id:        { type: integer }
        fromState: { oneOf: [{ $ref: '#/components/schemas/RideStatus' }, { type: 'null' }] }
        toState:   { $ref: '#/components/schemas/RideStatus' }
        actorType: { type: string, enum: [RIDER, DRIVER, ADMIN, SYSTEM] }
        actorId:   { type: string, format: uuid, nullable: true }
        metadata:  { type: object, additionalProperties: true }
        createdAt: { type: string, format: date-time }

    AdminDriver:
      type: object
      required: [id, displayName, phone, availability, isSuspended, vehicle, walletBalanceIqd]
      properties:
        id:          { type: string, format: uuid }
        displayName: { type: string }
        phone:       { type: string, description: E.164. Visible to admins only. }
        availability: { type: string, enum: [OFFLINE, ONLINE, ON_TRIP] }
        isSuspended: { type: boolean }
        suspendedReason: { type: string, nullable: true }
        rating:      { type: number, nullable: true }
        ridesCompleted: { type: integer, minimum: 0 }
        walletBalanceIqd: { type: integer }
        vehicle:
          type: object
          required: [plate, model, color]
          properties:
            plate: { type: string }
            model: { type: string }
            color: { type: string }
        createdAt: { type: string, format: date-time }

    AdminDriverPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/AdminDriver' }
        nextCursor: { type: string, nullable: true }

    AdminRideDetail:
      type: object
      required: [ride, events, ledgerEntries]
      properties:
        ride:   { $ref: '#/components/schemas/Ride' }
        events:
          type: array
          items: { $ref: '#/components/schemas/RideEvent' }
        ledgerEntries:
          type: array
          items: { $ref: '#/components/schemas/LedgerEntry' }
        offers:
          type: array
          items:
            type: object
            properties:
              driverId:   { type: string, format: uuid }
              status:     { type: string, enum: [PENDING, ACCEPTED, DECLINED, TIMED_OUT, SUPERSEDED] }
              distanceM:  { type: integer }
              offeredAt:  { type: string, format: date-time }
              respondedAt: { type: string, format: date-time, nullable: true }

    Dispute:
      type: object
      required: [id, rideId, status, reasonCode, createdAt]
      properties:
        id:          { type: string, format: uuid }
        rideId:      { type: string, format: uuid }
        openedBy:    { type: string, format: uuid }
        status:      { type: string, enum: [OPEN, RESOLVED, REJECTED] }
        reasonCode:  { type: string }
        description: { type: string }
        resolution:  { type: string, nullable: true }
        createdAt:   { type: string, format: date-time }
        resolvedAt:  { type: string, format: date-time, nullable: true }

    DisputePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Dispute' }
        nextCursor: { type: string, nullable: true }

    PlatformConfig:
      type: object
      required:
        - commission_bps
        - fare_base_iqd
        - fare_per_km_iqd
        - fare_per_minute_iqd
        - fare_minimum_iqd
        - fare_rounding_iqd
        - offer_timeout_seconds
        - search_radius_meters
      properties:
        commission_bps:        { type: integer, minimum: 0, maximum: 10000 }
        fare_base_iqd:         { type: integer, minimum: 0 }
        fare_per_km_iqd:       { type: integer, minimum: 0 }
        fare_per_minute_iqd:   { type: integer, minimum: 0 }
        fare_minimum_iqd:      { type: integer, minimum: 0 }
        fare_rounding_iqd:     { type: integer, minimum: 1 }
        offer_timeout_seconds: { type: integer, minimum: 5, maximum: 120 }
        search_radius_meters:  { type: integer, minimum: 500, maximum: 50000 }

    ReadinessReport:
      type: object
      required: [status, checks]
      properties:
        status: { type: string, enum: [ok, degraded] }
        checks:
          type: object
          properties:
            postgres: { type: string, enum: [ok, fail] }
            redis:    { type: string, enum: [ok, fail] }
