name: rideapp_rider
description: Rider app. Android only in v1 (CLAUDE.md §2 - no iOS builds).
version: 1.0.0
publish_to: none

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  rideapp_core:
    path: ../../packages/core

  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  firebase_messaging: ^15.1.5

  google_maps_flutter: ^2.9.0

  # Foreground location only. The rider app has NO background location: it
  # needs a pickup point while the user is looking at the screen, and asking a
  # passenger for "allow all the time" would be an unjustifiable privacy ask.
  geolocator: ^13.0.2

  web_socket_channel: ^3.0.1
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^6.0.0

flutter:
  uses-material-design: true
